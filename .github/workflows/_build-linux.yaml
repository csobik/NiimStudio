name: Linux console build

on:
  workflow_call:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Extract architecture
        id: architecture
        run: echo "ARCH=$(uname -m)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==1.8.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest
      - name: Package console application
        run: poetry run pyinstaller spec_files/cli_app/NiimStudio.spec --noconfirm --clean
      - name: Smoke-test executable
        run: dist/niimstudio --help
      - name: Create archive
        run: tar -C dist -czf "NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Linux-${{ steps.architecture.outputs.ARCH }}.tar.gz" niimstudio
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Linux-${{ steps.architecture.outputs.ARCH }}.tar.gz
          path: NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Linux-${{ steps.architecture.outputs.ARCH }}.tar.gz
          retention-days: 1
