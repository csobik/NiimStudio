name: Windows console build

on:
  workflow_call:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v4
      - name: Install Poetry
        run: pipx install poetry==1.8.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest
      - name: Package console application
        run: poetry run pyinstaller spec_files/cli_app/NiimStudio.spec --noconfirm --clean
      - name: Smoke-test executable
        run: .\dist\niimstudio.exe --help
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\niimstudio.exe -DestinationPath "NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Windows-X64.zip"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Windows-X64.zip
          path: NiimStudio-CLI-${{ steps.version.outputs.VERSION }}-Windows-X64.zip
          retention-days: 1
