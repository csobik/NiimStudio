name: Python console application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry==1.8.2
      - name: Select Python interpreter
        run: poetry env use "$pythonLocation/bin/python"
      - name: Install dependencies
        run: poetry install
      - name: Validate package metadata
        run: poetry check
      - name: Compile Python sources
        run: poetry run python -m compileall -q NiimPrintX
      - name: Check code style
        run: poetry run ruff check NiimPrintX tests
      - name: Check formatting
        run: poetry run ruff format --check NiimPrintX tests
      - name: Run tests
        run: poetry run pytest
      - name: Build Python distributions
        if: matrix.python-version == '3.12'
        run: poetry build
      - name: Build console executable
        if: matrix.python-version == '3.12'
        run: poetry run pyinstaller spec_files/cli_app/NiimStudio.spec --noconfirm --clean
      - name: Smoke-test console executable
        if: matrix.python-version == '3.12'
        run: dist/niimstudio --help
